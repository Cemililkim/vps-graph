name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graph-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm --prefix graph-ui ci
      - name: Frontend tests and build
        run: |
          npm --prefix graph-ui test
          npm --prefix graph-ui run build
          npm --prefix graph-ui audit --omit=dev
      - name: Kotlin and plugin validation
        run: |
          ./gradlew :scanner-core:test
          ./gradlew :intellij-plugin:test
          ./gradlew :intellij-plugin:buildPlugin
          ./gradlew :intellij-plugin:verifyPlugin
      - name: Linux helper tests
        run: |
          python -m unittest discover -s server-helper/tests -v
          python -m py_compile server-helper/vpsgraph_docker_scan.py
          sh -n server-helper/install.sh
          sh -n server-helper/uninstall.sh
      - name: Build release artifacts
        run: ./gradlew releaseArtifacts
      - name: Audit public source and archives
        run: >-
          node scripts/release-audit.mjs
          --plugin-zip intellij-plugin/build/distributions/intellij-plugin-0.1.1.zip
          --helper-archive build/distributions/vps-graph-server-helper-0.1.1.tar.gz
